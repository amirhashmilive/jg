<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Johar Gandhi — Series Episodes</title>

    
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/landing.css">
    <style>
        .series-header {
            padding: var(--space-2xl) var(--space-xl) var(--space-lg);
            text-align: center;
            background: linear-gradient(to bottom, rgba(10,10,10,0.9), var(--bg-primary));
            position: relative;
            z-index: 10;
        }
        
        .episode-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: var(--space-lg);
            padding: var(--space-xl) var(--space-2xl);
            max-width: var(--max-content-width);
            margin: 0 auto;
        }

        .ep-card {
            background: var(--bg-card);
            border: var(--border-subtle);
            border-radius: var(--radius-md);
            overflow: hidden;
            transition: transform var(--transition-fast), border-color var(--transition-fast);
            cursor: pointer;
            display: flex;
            flex-direction: column;
        }

        .ep-card:hover {
            transform: translateY(-4px);
            border-color: var(--accent-gold);
            box-shadow: var(--shadow-sm);
        }

        .ep-thumb {
            height: 160px;
            background-color: #111;
            background-size: cover;
            background-position: center;
            position: relative;
        }

        .ep-thumb::after {
            content: '▶';
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0,0,0,0.4);
            color: var(--text-primary);
            font-size: 2rem;
            opacity: 0;
            transition: opacity var(--transition-fast);
        }

        .ep-card:hover .ep-thumb::after {
            opacity: 1;
        }

        .ep-info {
            padding: var(--space-md);
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }

        .ep-num {
            font-family: var(--font-heading);
            font-size: 0.75rem;
            color: var(--accent-saffron);
            text-transform: uppercase;
            letter-spacing: 0.1em;
            margin-bottom: var(--space-xs);
        }

        .ep-title {
            font-family: var(--font-heading);
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: var(--space-sm);
            line-height: 1.3;
        }

    </style>
</head>
<body>
    <a href="../index.html" class="home-button">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
        Home
    </a>
    
    <header class="series-header">
        <h1 class="display-lg" id="series-title">Loading...</h1>
        <p class="body-md text-muted" id="series-subtitle"></p>
        <div class="gold-line" style="margin: var(--space-md) auto;"></div>
    </header>

    <main>
        <div class="episode-grid" id="ep-grid">
            <!-- Populated via JS -->
        </div>
    </main>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const series = parseInt(urlParams.get('s')) || 1;
        
        const titleEl = document.getElementById('series-title');
        const subtitleEl = document.getElementById('series-subtitle');
        const gridEl = document.getElementById('ep-grid');

        if (series === 1) {
            titleEl.textContent = "MOHANDAS";
            subtitleEl.textContent = "Series 1 — The First Visit, 1920";
        } else {
            titleEl.textContent = "THE MAHATMA";
            subtitleEl.textContent = "Series 2 — The Second Visit, 1933";
        }

        // Fetch the 10 episodes
        async function loadEpisodes() {
            gridEl.innerHTML = '';
            const promises = [];
            
            for (let i = 1; i <= 10; i++) {
                const epNum = i.toString().padStart(2, '0');
                const promise = fetch(`../data/series${series}/episode${epNum}.json`)
                    .then(res => res.ok ? res.json() : null)
                    .then(data => ({ data: data || { title: `Episode ${i}`, series, episode: i }, index: i }))
                    .catch(() => ({ data: { title: `Episode ${i}`, series, episode: i }, index: i }));
                promises.push(promise);
            }
            
            const results = await Promise.all(promises);
            // Ensure they are strictly ordered by index
            results.sort((a, b) => a.index - b.index);
            
            results.forEach(item => {
                renderCard(item.data, item.index);
            });
        }

        function renderCard(data, index) {
            const epNum = index.toString().padStart(2, '0');
            // Assuming slide-001 is a good thumbnail
            const thumbUrl = `../images/series${series}/ep${epNum}/slide-001.webp`;
            
            const card = document.createElement('a');
            card.href = `player.html?s=${series}&e=${index}`;
            card.className = 'ep-card';
            
            card.innerHTML = `
                <div class="ep-thumb" style="background-image: url('${thumbUrl}')"></div>
                <div class="ep-info">
                    <span class="ep-num">Episode ${epNum}</span>
                    <h3 class="ep-title">${data.title || 'Untitled'}</h3>
                </div>
            `;
            gridEl.appendChild(card);
        }

        loadEpisodes();
    </script>
</body>
</html>

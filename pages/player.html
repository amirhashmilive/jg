<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Johar Gandhi — Episode Player</title>

    
    <link rel="stylesheet" href="../css/global.css?v=4">
    <link rel="stylesheet" href="../css/animations.css?v=4">
    <link rel="stylesheet" href="../css/player.css?v=4">
    <style>
        .next-episode-btn {
            display: inline-block;
            background: var(--accent-gold);
            color: var(--bg-primary);
            padding: 0.75rem 2rem;
            border-radius: 30px;
            font-family: var(--font-heading);
            font-size: 1rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            margin-top: 1.5rem;
            cursor: pointer;
            transition: background 0.3s, transform 0.2s;
            border: none;
            text-decoration: none;
        }
        .next-episode-btn:hover {
            background: var(--accent-gold-bright);
            transform: translateY(-2px);
            color: var(--bg-primary);
        }
    </style>
</head>
<body>
    
    <div class="player-container" id="slide-container">
        <!-- Slides injected by JS -->
        <div class="center-content">
            <p class="body-lg text-muted">Loading Episode...</p>
        </div>
    </div>

    <!-- Scripts -->
    <script type="module" src="../js/app.js?v=6"></script>
</body>
</html>
